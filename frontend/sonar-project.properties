# SonarQube — ISEP Frontend (Next.js / TypeScript)
# Run: npm run sonar   (requires SONAR_TOKEN env var and SonarQube at http://localhost:9010)

sonar.projectKey=isep-frontend
sonar.projectName=ISEP Frontend

sonar.host.url=http://localhost:9010
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Optional: uncomment and set path after running tests with coverage
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
