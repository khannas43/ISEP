spring:
  application:
    name: meeting-service
  datasource:
    # Use POSTGRES_PORT=5433 when your Postgres runs on 5433 (e.g. Docker)
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:isep}
    username: ${POSTGRES_USER:isep_app}
    password: ${POSTGRES_PASSWORD:isep_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: core
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}

spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 110MB

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9100}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:isep-documents}

# CORS: allow frontend origin (comma-separated for multiple)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT validation (Keycloak) - JWKS URI for isep-realm (default port 8180 to match frontend .env)
spring.security.oauth2.resourceserver.jwt:
  jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/isep-realm/protocol/openid-connect/certs}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/isep-realm}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger UI (disable in prod via application-prod.yml)
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: in.gov.dgs.isep.meeting
  show-actuator: false

