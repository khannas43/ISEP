# Nginx dev config - proxies to Kong and (optional) Next.js
# For full stack, run Next.js on host and proxy / to host, or add frontend service later.

events {
    worker_connections 1024;
}

http {
    upstream kong {
        server kong:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # API via Kong
        location /api/ {
            proxy_pass http://kong;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth (Keycloak) - can be proxied through Kong or directly
        location /auth/ {
            proxy_pass http://kong;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Y.js WebSocket — Upgrade headers required (Batch 5 /collab → Kong → yjs-server)
        location /collab {
            proxy_pass http://kong;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Frontend (Next.js on host) - uncomment and set port when running frontend
        # location / {
        #     proxy_pass http://host.docker.internal:3000;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection 'upgrade';
        #     proxy_set_header Host $host;
        #     proxy_cache_bypass $http_upgrade;
        # }
        location / {
            return 200 'ISEP DEV - Start frontend with npm run dev in frontend/';
            add_header Content-Type text/plain;
        }
    }
}
