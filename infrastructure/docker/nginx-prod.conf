# Nginx prod — app at /isep (http://148.230.66.191/isep, no SSL), /isep/api → Kong, Keycloak at /realms
# Used by docker-compose.prod.yml. PUBLIC_BASE_URL = http://148.230.66.191/isep

events {
    worker_connections 1024;
}

http {
    # When request Host is "nginx" (frontend container token call), send this to Keycloak so token iss matches backend
    map $host $keycloak_host {
        nginx  148.230.66.191;
        default $host;
    }

    upstream frontend {
        server frontend:3000;
    }
    upstream kong {
        server kong:8000;
    }
    upstream keycloak {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name _;

        # Root → redirect to app
        location = / {
            return 301 /isep/;
        }

        # ISEP app at /isep (Next.js basePath)
        location /isep/ {
            proxy_pass http://frontend/isep/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
        # Proxy exact /isep (no redirect) to avoid loop with Next.js trailing-slash redirect
        location = /isep {
            proxy_pass http://frontend/isep/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NextAuth credentials callback without trailing slash — proxy to backend WITH trailing slash to avoid Next.js 308
        location = /isep/api/auth/callback/credentials {
            proxy_pass http://frontend/isep/api/auth/callback/credentials/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NextAuth API (session, providers, other auth) — frontend, not Kong
        location /isep/api/auth/ {
            proxy_pass http://frontend/isep/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API under /isep/api → Kong as /api/ (backend services only)
        location /isep/api/ {
            proxy_pass http://kong/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak (realms, auth). Set Host to public hostname so tokens get iss=http://PUBLIC/realms/isep-realm (backend expects that).
        location /realms/ {
            proxy_pass http://keycloak/realms/;
            proxy_http_version 1.1;
            proxy_set_header Host $keycloak_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /auth/ {
            proxy_pass http://keycloak/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
